<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ابزارهای آموزشی</title>
<style>
  :root{
    --bg1:#1e3a8a; --bg2:#7c3aed; --bg3:#ec4899;
    --glass:rgba(255,255,255,.16); --glass-b:rgba(255,255,255,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Vazirmatn","Tahoma","Segoe UI",system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0f172a;color:#fff;
  }
  .phone{
    position:relative;width:390px;height:800px;max-height:96vh;
    border-radius:44px;overflow:hidden;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    box-shadow:0 0 0 10px #111827,0 0 0 12px #374151,0 30px 80px rgba(0,0,0,.6);
    display:flex;flex-direction:column;
  }
  .phone::before{
    content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:110px;height:28px;background:#000;border-radius:20px;z-index:5;
  }
  .status{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 28px 0;font-size:14px;font-weight:600;direction:ltr;z-index:4;
  }
  .status .right{display:flex;gap:6px;align-items:center;font-size:12px}
  .batt{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}
  .batt::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1px}

  .hero{padding:34px 28px 6px;text-align:center}
  .hero h1{font-size:26px;font-weight:800}
  .hero p{font-size:13px;opacity:.8;margin-top:6px}

  .grid{
    flex:1;display:grid;grid-template-columns:repeat(3,1fr);
    gap:28px 8px;padding:34px 22px;align-content:start;
  }
  .app{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    text-decoration:none;color:#fff;background:none;border:0;cursor:pointer;
    font:inherit;transition:transform .15s;
  }
  .app:active{transform:scale(.9)}
  .icon{
    width:66px;height:66px;border-radius:20px;display:grid;place-items:center;
    background:rgba(255,255,255,.95);
    box-shadow:0 8px 18px rgba(0,0,0,.25),inset 0 1px 0 #fff;
  }
  .icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .t1{color:#4f46e5}.t2{color:#0d9488}.t3{color:#2563eb}.t4{color:#db2777}.t5{color:#475569}.t6{color:#ea580c}.t7{color:#0891b2}
  .app span{font-size:12px;font-weight:600;text-align:center;line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .app span.en{font-family:system-ui,"Segoe UI",sans-serif;letter-spacing:.2px}

  .dock{
    margin:0 16px 16px;padding:12px 12px 14px;border-radius:30px;
    background:var(--glass);border:1px solid var(--glass-b);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    text-align:center;font-size:12px;line-height:1.9;
  }
  .dock b{font-weight:700}
  .dock .sub{opacity:.85}
  .home-bar{width:120px;height:5px;background:rgba(255,255,255,.7);border-radius:3px;margin:0 auto 9px}

  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:11;
    background:rgba(255,255,255,.97);color:#111827;
    border-radius:28px 28px 0 0;padding:14px 18px 26px;
    transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open{transform:none}
  .grab{width:44px;height:5px;background:#cbd5e1;border-radius:3px;margin:0 auto 14px}
  .sheet h2{font-size:18px;margin-bottom:4px}
  .sheet .sub{font-size:12px;color:#64748b;margin-bottom:14px}
  .game{
    display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:10px;
    border-radius:16px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;
    font:inherit;color:inherit;text-align:right;transition:background .15s,border-color .15s,transform .1s;
  }
  .game:hover{background:#f5f7ff;border-color:#c7d2fe}
  .game:active{transform:scale(.98)}
  .game .gi{width:44px;height:44px;border-radius:12px;background:#eef2ff;color:#4f46e5;display:grid;place-items:center;flex:none}
  .game .gi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .game b{display:block;font-size:14px}
  .game small{color:#64748b;font-size:11px}
  .game .dl{margin-right:auto;color:#4f46e5;display:grid}
  .game .dl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .toast{
    position:absolute;top:60px;left:50%;transform:translate(-50%,-90px);
    background:#111827;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
    transition:transform .3s;z-index:20;white-space:nowrap;
  }
  .toast.show{transform:translate(-50%,0)}

  @media (max-width:430px){
    body{background:none}
    .phone{width:100vw;height:100vh;max-height:none;border-radius:0;box-shadow:none}
    .phone::before{display:none}
    .status{padding-top:10px}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span id="clock">12:00</span>
    <span class="right">5G <span class="batt"></span></span>
  </div>

  <div class="hero">
    <h1>ابزارهای آموزشی</h1>
    <p>برای شروع روی یکی از برنامه‌ها بزنید</p>
  </div>

  <div class="grid">
    <a class="app" href="https://azarsam936-svg.github.io/quiz-maker/" target="_blank" rel="noopener">
      <div class="icon t1">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      </div><span>آزمون‌ساز</span>
    </a>

    <a class="app" href="https://azarsam936-svg.github.io/flipcard/" target="_blank" rel="noopener">
      <div class="icon t2">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 7V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>
      </div><span>فلش‌کارت‌ساز</span>
    </a>

    <a class="app" href="https://azarsam936-svg.github.io/exam-corrector/" target="_blank" rel="noopener">
      <div class="icon t3">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8.5 9 1.5 1.5L13 7.5"/><path d="m8.5 16 1.5 1.5 3-3"/><path d="M15 9.5h2M15 16h2"/></svg>
      </div><span>تصحیح آزمون آنلاین</span>
    </a>

    <a class="app" href="https://azarsam936-svg.github.io/TIMSS/" target="_blank" rel="noopener">
      <div class="icon t6">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8"/><path d="M4.5 12v6c0 1.5 3.4 2.8 7.5 2.8"/><path d="M19.5 5.5V10"/><circle cx="17" cy="16" r="3.2"/><path d="m19.4 18.4 2 2"/></svg>
      </div><span>بانک سوالات تیمز</span>
    </a>

    <a class="app" href="https://azarsam936-svg.github.io/lessonplan/" target="_blank" rel="noopener">
      <div class="icon t7">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2.5v3M16 2.5v3M4 9h16"/><path d="m9 15 2 2 4-4"/></svg>
      </div><span>طرح درس روزانه</span>
    </a>

    <button class="app" id="openGames" type="button">
      <div class="icon t4">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="11.5" r=".6"/><circle cx="17.8" cy="13.5" r=".6"/></svg>
      </div><span>بازی‌های آموزشی</span>
    </button>

    <button class="app" id="hub" type="button">
      <div class="icon t5">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="m6.5 7.3 3.6 3M17.5 7.3l-3.6 3M6.5 16.7l3.6-3M17.5 16.7l-3.6-3"/></svg>
      </div><span class="en">Class Hub</span>
    </button>
  </div>

  <div class="dock">
    <div class="home-bar"></div>
    طراح: <b>سما بنا آذرپناه</b><br>
    <span class="sub">دبیر علوم ناحیه ۳ تبریز</span>
  </div>

  <div class="sheet-bg" id="bg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="بازی‌های آموزشی">
    <div class="grab"></div>
    <h2>بازی‌های آموزشی</h2>
    <p class="sub">با انتخاب هر بازی، فایل HTML آن دانلود می‌شود.</p>
    <div id="list"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  const BASE = "https://raw.githubusercontent.com/azarsam936-svg/ChemiSafe/main/git%20pics/";
  const ICON = {
    atom:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/></svg>',
    ruler:'<svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>',
    flask:'<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>',
    bolt:'<svg viewBox="0 0 24 24"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg>',
    dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>'
  };
  const games = [
    {title:"مدل اتمی بور", sub:"ساختار اتم", icon:"atom",
     file:"bohr-atom-game-22(1).html", path:"bohr-atom-game-22(1).html"},
    {title:"اندازه‌گیری و ابزارهای آن", sub:"علوم", icon:"ruler",
     file:"اندازه-گیری-و-ابزارها.html",
     path:"%D8%A8%D8%A7%D8%B2%DB%8C%20%D8%B9%D9%84%D9%88%D9%85-%D8%A7%D9%86%D8%AF%D8%A7%D8%B2%D9%87%20%DA%AF%DB%8C%D8%B1%DB%8C%20%D9%88%20%D8%A7%D8%A8%D8%B2%D8%A7%D8%B1%20%D9%87%D8%A7%DB%8C%20%D8%A7%D9%93%D9%86.html"},
    {title:"دنیای شگفت‌انگیز مولکول‌ها", sub:"شیمی", icon:"flask",
     file:"دنیای-شگفت-انگیز-مولکول-ها.html",
     path:"%D8%AF%D9%86%DB%8C%D8%A7%DB%8C_%D8%B4%DA%AF%D9%81%D8%AA%D8%A7%D9%86%DA%AF%DB%8C%D8%B2_%D9%85%D9%88%D9%84%DA%A9%D9%88%D9%84%D9%87%D8%A7-1.html"},
    {title:"ماجرای الکترون‌ها", sub:"ساختار اتم", icon:"bolt",
     file:"ماجرای-الکترون-ها.html",
     path:"%D9%85%D8%A7%D8%AC%D8%B1%D8%A7%DB%8C%20%D8%A7%D9%84%DA%A9%D8%AA%D8%B1%D9%88%D9%86%D9%87%D8%A7.html"}
  ];

  const $ = id => document.getElementById(id);
  const list = $("list");

  games.forEach(g => {
    const b = document.createElement("button");
    b.className = "game"; b.type = "button";
    b.innerHTML = `<div class="gi">${ICON[g.icon]}</div>
      <div><b>${g.title}</b><small>${g.sub}</small></div><span class="dl">${ICON.dl}</span>`;
    b.onclick = () => download(g);
    list.appendChild(b);
  });

  async function download(g){
    const url = BASE + g.path;
    toast("در حال دانلود…");
    try{
      const r = await fetch(url);
      if(!r.ok) throw new Error(r.status);
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = g.file;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      toast("دانلود شروع شد");
    }catch(e){
      window.open(url, "_blank", "noopener");
      toast("فایل در تب جدید باز شد");
    }
  }

  const sheet=$("sheet"), bg=$("bg");
  const setOpen = o => { sheet.classList.toggle("open",o); bg.classList.toggle("open",o); };
  $("openGames").onclick = () => setOpen(true);
  bg.onclick = () => setOpen(false);
  document.addEventListener("keydown", e => e.key==="Escape" && setOpen(false));
  $("hub").onclick = () => toast("بزودی");

  let t;
  function toast(msg){
    const el=$("toast"); el.textContent=msg; el.classList.add("show");
    clearTimeout(t); t=setTimeout(()=>el.classList.remove("show"),2200);
  }

  function tick(){
    const d=new Date();
    $("clock").textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  }
  tick(); setInterval(tick,20000);
</script>
</body>
</html>
